name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Keep main's baselines; only superseded PR runs should be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: ${{ matrix.package }} benchmarks
    # Keep the image pinned to a release supported by CodSpeed's simulator.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ajika
            bench: runtime
          - package: ajika_storage
            bench: storage
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/cargo-cache
        with:
          scope: codspeed-${{ matrix.package }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-codspeed@4.7.0
      - name: Build benchmarks
        run: cargo codspeed build --measurement-mode simulation,memory -p ${{ matrix.package }} --bench ${{ matrix.bench }} --locked
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation,memory
          # Track allocation counts separately so runner-specific allocator costs stay out of CPU scores.
          exclude-allocations: true
          run: cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.bench }}
