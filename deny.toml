[advisories]
version = 2
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]

# The handbook's filesystem watcher and its Linux notification bindings.
[[licenses.exceptions]]
name = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "inotify"
allow = ["ISC"]

[[licenses.exceptions]]
name = "inotify-sys"
allow = ["ISC"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
